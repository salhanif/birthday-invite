<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #0e0137, #fad0c4);
      padding: 20px;
      overflow-x: hidden;
      animation: fadeIn 1.5s ease-in-out;
    }

    h1 {
      font-size: 2.5rem;
      animation: bounce 2s infinite;
    }

    h2 {
      margin-bottom: 20px;
      opacity: 0;
      animation: slideDown 1.5s ease forwards;
      animation-delay: 0.5s;
    }

    img {
      width: 300px;
      border-radius: 20px;
      margin: 20px 0;
      opacity: 0;
      animation: fadeInUp 1.5s ease forwards;
      animation-delay: 1s;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    ul {
      list-style: none;
      padding: 0;
      font-size: 1.1rem;
      opacity: 0;
      animation: fadeInUp 1.5s ease forwards;
      animation-delay: 1.5s;
    }

    li {
      margin: 10px 0;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background-color: #210148;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      transition: 0.3s ease;
      opacity: 0;
      animation: fadeInUp 1.5s ease forwards;
      animation-delay: 2s;
    }

    a:hover {
      background-color: #e91e63;
      transform: scale(1.1);
    }

    /* Floating balloons */
    .balloon {
      position: absolute;
      bottom: -150px;
      font-size: 40px;
      animation: float 8s linear infinite;
    }

    .balloon:nth-child(1) { left: 10%; animation-delay: 0s; }
    .balloon:nth-child(2) { left: 30%; animation-delay: 2s; }
    .balloon:nth-child(3) { left: 50%; animation-delay: 4s; }
    .balloon:nth-child(4) { left: 70%; animation-delay: 1s; }
    .balloon:nth-child(5) { left: 90%; animation-delay: 3s; }

    /* Keyframes */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }

  </style>
</head>

<body>

  <!-- Floating balloons -->
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>

  <h1>🎉 It's Faisal Birthday! 🎉</h1>
  <h2>On the 18th February</h2>

  <img src="https://raw.githubusercontent.com/appbrewery/webdev/main/birthday-cake3.4.jpeg"
       alt="Purple birthday cake with candles" />

  <h3>What to bring:</h3>
  <ul>
    <li>🎈 Balloons (I love balloons)</li>
    <li>🍰 Cake and Chicken strip 🍗 (I'm really good at eating)</li>
    <li>🍔 An appetite (There will be lots of food)</li>
  </ul>

  <h3>This is where you need to go:</h3>
  <a href="https://www.google.com/maps">View Location</a>

</body>
</html>
